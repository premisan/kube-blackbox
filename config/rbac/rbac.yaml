apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-pinger-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-pinger-manager-role
rules:
  # Pod and Pod logs permissions
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Events permissions
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # PodRestartHistory CRD permissions
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories/status"]
    verbs: ["get", "update", "patch"]
  # Coordination for leader election (if enabled)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-pinger-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-pinger-manager-role
subjects:
  - kind: ServiceAccount
    name: kube-pinger-controller-manager
    namespace: kube-system
