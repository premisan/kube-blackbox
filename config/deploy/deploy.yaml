apiVersion: v1
kind: Namespace
metadata:
  name: kube-blackbox
  labels:
    app.kubernetes.io/name: kube-blackbox
    app.kubernetes.io/part-of: kube-blackbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-blackbox
  namespace: kube-blackbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-blackbox
rules:
  # Pod and Pod logs permissions
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Events permissions (Read for diagnostics, Create/Patch for Leader Election)
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # PodRestartHistory CRD permissions
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories/status"]
    verbs: ["get", "update", "patch"]
  # Coordination for leader election (if enabled)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-blackbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-blackbox
subjects:
  - kind: ServiceAccount
    name: kube-blackbox
    namespace: kube-blackbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-blackbox
  namespace: kube-blackbox
  labels:
    app.kubernetes.io/name: kube-blackbox
    app.kubernetes.io/part-of: kube-blackbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-blackbox
  template:
    metadata:
      labels:
        app: kube-blackbox
    spec:
      serviceAccountName: kube-blackbox
      terminationGracePeriodSeconds: 10
      containers:
        - name: kube-blackbox
          image: premisan0/kube-blackbox:latest
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - --leader-elect=true
            - --leader-election-namespace=kube-blackbox
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --max-history-per-container=5
            - --history-ttl=168h
            - --analysis-language=ko # Supported: ko, en
            - --log-tail-lines=500
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANALYSIS_LANGUAGE
              value: "ko"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
