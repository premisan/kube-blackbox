apiVersion: v1
kind: Namespace
metadata:
  name: kube-pinger-system
  labels:
    app.kubernetes.io/name: kube-pinger
    app.kubernetes.io/part-of: kube-pinger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-pinger-controller-manager
  namespace: kube-pinger-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-pinger-manager-role
rules:
  # Pod and Pod logs permissions
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Events permissions
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # PodRestartHistory CRD permissions
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["observer.io"]
    resources: ["podrestarthistories/status"]
    verbs: ["get", "update", "patch"]
  # Coordination for leader election (if enabled)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-pinger-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-pinger-manager-role
subjects:
  - kind: ServiceAccount
    name: kube-pinger-controller-manager
    namespace: kube-pinger-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-pinger-controller-manager
  namespace: kube-pinger-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kube-pinger
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: kube-pinger-controller-manager
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: premisan0/kube-pinger:v0.3.0
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --max-history-per-container=5
            - --history-ttl=168h
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
