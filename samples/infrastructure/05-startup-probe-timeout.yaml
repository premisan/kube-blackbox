apiVersion: v1
kind: Pod
metadata:
  name: sample-startup-probe-timeout
  labels:
    app: sample-startup-probe-timeout
    category: infrastructure
spec:
  restartPolicy: Always
  containers:
    - name: slow-starter
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[INFO] Container starting with slow initialization (simulating cold start cache loading)..."
          echo "[INFO] Expected initialization time: 40 seconds..."
          sleep 40
          touch /tmp/ready
          echo "[INFO] Initialization complete, ready probe active."
          sleep 3600
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/ready
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 3
