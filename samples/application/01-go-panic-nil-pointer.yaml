apiVersion: v1
kind: Pod
metadata:
  name: sample-go-panic
  labels:
    app: sample-go-panic
    category: application
spec:
  restartPolicy: Always
  containers:
    - name: payment-service
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[INFO] Initializing payment processing service..."
          sleep 3
          echo "[INFO] Processing incoming transactions..."
          sleep 2
          echo "[ERROR] Unhandled exception occurred in main routine!" >&2
          echo "panic: runtime error: invalid memory address or nil pointer dereference" >&2
          echo "[signal SIGSEGV: segmentation violation code=0x1 addr=0x0 pc=0x4b2c1f]" >&2
          echo "" >&2
          echo "goroutine 1 [running]:" >&2
          echo "main.processPayment(0x0, 0xc0000a2000)" >&2
          echo "	/build/payment/service.go:128 +0x2e" >&2
          echo "main.main()" >&2
          echo "	/build/payment/main.go:45 +0x10b" >&2
          exit 2
