apiVersion: v1
kind: Pod
metadata:
  name: sample-php-fpm-max-children
  labels:
    app: sample-php-fpm-max-children
    category: application
spec:
  restartPolicy: Always
  containers:
    - name: php-fpm
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[2026-11-02 03:00:00] NOTICE: fpm is running, pid 1"
          echo "[2026-11-02 03:00:00] NOTICE: ready to handle connections"
          sleep 3
          echo "[2026-11-02 03:00:05] WARNING: [pool www] server reached max_children setting (10), consider raising it" >&2
          sleep 2
          echo "[2026-11-02 03:00:07] ERROR: Unable to accept FastCGI connections, worker pool saturated" >&2
          exit 1
