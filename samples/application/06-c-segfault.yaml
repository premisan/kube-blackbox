apiVersion: v1
kind: Pod
metadata:
  name: sample-c-segfault
  labels:
    app: sample-c-segfault
    category: application
spec:
  restartPolicy: Always
  containers:
    - name: native-worker
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[INFO] Starting C/C++ native image rendering engine..."
          sleep 3
          echo "[DEBUG] Dereferencing frame buffer pointer at address 0x00000000..."
          echo "[ERROR] Invalid memory pointer access: code=0x1 addr=0x0" >&2
          echo "Segmentation fault (core dumped)" >&2
          exit 139
