apiVersion: v1
kind: Pod
metadata:
  name: sample-python-crash
  labels:
    app: sample-python-crash
spec:
  restartPolicy: Always
  containers:
    - name: python-worker
      image: python:3.11-alpine
      command: ["python", "-u", "-c"]
      args:
        - |
          import time, sys

          print("[INFO] Python worker service started successfully", flush=True)
          time.sleep(3)
          print("[INFO] Processing batch analytics jobs...", flush=True)
          time.sleep(2)

          # Deliberately raise an unhandled exception to simulate application crash
          def process_record(record_id):
              if record_id == 42:
                  raise ValueError(f"Corrupted payload detected for record_id={record_id}")
              return True

          print("[ERROR] Fatal error during batch processing:", file=sys.stderr, flush=True)
          process_record(42)
