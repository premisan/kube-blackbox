apiVersion: v1
kind: Pod
metadata:
  name: sample-squid-proxy-acl-denied
  labels:
    app: sample-squid-proxy-acl-denied
    category: dependency
spec:
  restartPolicy: Always
  containers:
    - name: secure-downloader
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[INFO] Tunneling CONNECT request to target api.partner.com:443 via forward proxy..."
          echo "HTTP/1.1 403 Forbidden" >&2
          echo "The following error was encountered while trying to retrieve the URL: https://api.partner.com:443/" >&2
          echo "Access Denied. (ERR_ACCESS_DENIED)" >&2
          echo "[FATAL] Egress HTTP proxy policy blocked access to destination domain: 403 Forbidden (ERR_ACCESS_DENIED)." >&2
          exit 1
