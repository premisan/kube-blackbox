apiVersion: v1
kind: Pod
metadata:
  name: sample-network-conn-reset
  labels:
    app: sample-network-conn-reset
    category: dependency
spec:
  restartPolicy: Always
  containers:
    - name: api-client
      image: busybox:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "[INFO] Connecting to external microservice upstream: http://upstream-service:8080/v1/sync..."
          echo "[WARN] Upstream response delayed, waiting on socket read..."
          echo "ERROR: read tcp 10.244.2.45:49812->10.96.100.20:8080: read: connection reset by peer (ECONNRESET)" >&2
          echo "Fatal: Upstream connection abruptly closed with TCP RST during request processing." >&2
          exit 1
